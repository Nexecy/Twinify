<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="White Toothless sticker">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#5b21b6" flood-opacity="0.28"/>
    </filter>
  </defs>
  <!-- sticker rim -->
  <ellipse cx="32" cy="34" rx="26" ry="24" fill="#ede9fe" filter="url(#soft)"/>
  <!-- head -->
  <ellipse cx="32" cy="34" rx="22" ry="20" fill="#fafafa"/>
  <!-- ear fins -->
  <path d="M14 22 C10 10 18 8 22 16 Z" fill="#fafafa"/>
  <path d="M50 22 C54 10 46 8 42 16 Z" fill="#fafafa"/>
  <path d="M15 21 C12 13 17 12 20 17 Z" fill="#e8e8e8"/>
  <path d="M49 21 C52 13 47 12 44 17 Z" fill="#e8e8e8"/>
  <!-- snout -->
  <ellipse cx="32" cy="40" rx="11" ry="8" fill="#f0f0f0"/>
  <!-- nostrils -->
  <ellipse cx="28" cy="40" rx="1.6" ry="2.2" fill="#c4c4c4"/>
  <ellipse cx="36" cy="40" rx="1.6" ry="2.2" fill="#c4c4c4"/>
  <!-- eyes -->
  <ellipse cx="22" cy="30" rx="7.5" ry="8.5" fill="#9fe870"/>
  <ellipse cx="42" cy="30" rx="7.5" ry="8.5" fill="#9fe870"/>
  <ellipse cx="22" cy="31" rx="3.2" ry="5.2" fill="#0a0a0a"/>
  <ellipse cx="42" cy="31" rx="3.2" ry="5.2" fill="#0a0a0a"/>
  <ellipse cx="20.5" cy="27.5" rx="1.6" ry="2" fill="#fff" opacity="0.95"/>
  <ellipse cx="40.5" cy="27.5" rx="1.6" ry="2" fill="#fff" opacity="0.95"/>
  <!-- cheek blush -->
  <ellipse cx="15" cy="38" rx="3" ry="1.8" fill="#f0abfc" opacity="0.7"/>
  <ellipse cx="49" cy="38" rx="3" ry="1.8" fill="#f0abfc" opacity="0.7"/>
</svg>
